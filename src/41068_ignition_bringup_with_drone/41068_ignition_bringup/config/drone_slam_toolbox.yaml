/drone/slam_toolbox:
  ros__parameters:
    # Core frames (match EXACTLY your TF / topics)
    map_frame: "drone/map"
    odom_frame: "drone/odom"
    base_frame: "drone_base_link"
    scan_topic: "/drone/scan"

    # Common mapping settings (sane defaults)
    mode: "mapping"
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 30.0
    minimum_time_interval: 0.05

    # ROS time & serialization
    use_sim_time: true
    throttle_scans: 1

    # Data handling
    enable_interactive_mode: false
    enable_pose_extrapolator: true

    # Do not try to save/load maps automatically for now
    serialised_map: ""
    map_start_at_dock: false
